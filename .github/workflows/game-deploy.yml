name: Game deploy (keyless, reusable)

# Reusable workflow every freegamestore-online game's deploy.yml calls, pinned
# by commit SHA (freegamestore-online/platform packages/compliance
# GAME_DEPLOY_WORKFLOW). The keyless successor of game-ci.yml (platform#488,
# #438): no R2 secret anywhere.
#
#   compliance — install, build, the pinned `fgs check`, version.json stamp,
#                smoke test, then the built web/dist as an artifact. No secrets
#                and no id-token: a compromised npm package can fail the build only.
#   deploy     — push/dispatch on main only. Downloads the artifact and uploads
#                it with a GitHub OIDC token to admin.freegamestore.online, which
#                writes it under this game's own R2 prefix and switches the route
#                to it once every file is in. Runs no project code.
#
# The caller must grant `id-token: write` (a called workflow cannot exceed the
# caller's permissions). The upload client is the same bash/curl/jq script as
# the FAS generator's KEYLESS_UPLOAD (freeappstore-online/platform
# packages/cli/src/lib/starter-foundation.ts); keep them in step.

on:
  workflow_call:
    inputs:
      compliance_cli_version:
        description: "Pinned @freegamestore/cli version for the compliance gate. Bump deliberately."
        required: false
        type: string
        default: "0.2.7"
      node_version:
        description: "Node.js major version"
        required: false
        type: string
        default: "22"

jobs:
  # Build + compliance check. NO secrets and no id-token in this job.
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Platform compliance — runs every check the CLI ships (bundle size,
      # brand fonts, tracking SDKs, PWA manifest, store link, audio mute,
      # viewport, brand-token leaks). Pinned version so a CLI release can't
      # silently flip green deploys to red.
      - name: Platform compliance
        run: npx -y "@freegamestore/cli@${{ inputs.compliance_cli_version }}" check

      - name: Stamp version.json
        run: |
          cat > web/dist/version.json <<JSON
          {
            "repo": "${GITHUB_REPOSITORY##*/}",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${GITHUB_SHA::7}",
            "version": "${GITHUB_SHA::7}",
            "source": "build-stamp",
            "ref": "${GITHUB_REF_NAME}",
            "runNumber": ${GITHUB_RUN_NUMBER},
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "version.json:"; cat web/dist/version.json

      - name: Smoke test built game
        run: |
          smoke_run() {
            pnpm --dir web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/fgs-preview.log 2>&1 &
            local PREVIEW_PID=$!
            local up=0
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then up=1; break; fi
              sleep 1
            done
            if [ "$up" != 1 ]; then
              echo "::error::vite preview never answered on 127.0.0.1:4173. Preview log:"
              cat /tmp/fgs-preview.log || true
              kill "$PREVIEW_PID" 2>/dev/null || true
              return 1
            fi
            local rc=0
            node <<'NODE' || rc=$?
          const { spawn } = require("node:child_process");
          async function main() {
          const chromeBin = process.env.CHROME_BIN || "/usr/bin/google-chrome";
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const chrome = spawn(chromeBin, [
            "--headless=new",
            "--disable-gpu",
            "--no-sandbox",
            "--remote-debugging-address=127.0.0.1",
            "--remote-debugging-port=9222",
            "--disable-dev-shm-usage",
            "--no-first-run",
            "--no-default-browser-check",
            "--disable-background-networking",
            "--user-data-dir=/tmp/fgs-smoke-chrome",
            "about:blank",
          ], { stdio: ["ignore", "ignore", "pipe"], env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: "/dev/null" } });
          let stderr = "";
          chrome.stderr.on("data", (chunk) => { stderr += chunk.toString(); });
          async function fetchJson(url, init) {
            const res = await fetch(url, init);
            if (!res.ok) throw new Error(url + " returned HTTP " + res.status);
            return res.json();
          }
          try {
            for (let i = 0; i < 80; i++) {
              try { await fetchJson("http://127.0.0.1:9222/json/version"); break; }
              catch { if (i === 79) throw new Error("Chrome DevTools did not start: " + stderr.slice(-1000)); await delay(250); }
            }
            let target;
            try {
              target = await fetchJson("http://127.0.0.1:9222/json/new?http://127.0.0.1:4173/", { method: "PUT" });
            } catch {
              target = (await fetchJson("http://127.0.0.1:9222/json/list"))[0];
            }
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            let seq = 0;
            const pending = new Map();
            const errors = [];
            function isIgnoredBrowserNoise(text) {
              return /Failed to load resource: the server responded with a status of 404/.test(text) ||
                /auth\.freegamestore\.online\/v1\/me/.test(text) ||
                /No 'Access-Control-Allow-Origin' header/.test(text) ||
                /Failed to load resource: net::ERR_FAILED/.test(text);
            }
            let loaded = false;
            ws.onmessage = (event) => {
              const msg = JSON.parse(event.data);
              if (msg.id && pending.has(msg.id)) {
                pending.get(msg.id)(msg);
                pending.delete(msg.id);
                return;
              }
              if (msg.method === "Page.loadEventFired") loaded = true;
              if (msg.method === "Runtime.exceptionThrown") {
                const ex = msg.params.exceptionDetails;
                errors.push(ex.exception?.description || ex.text || "Runtime exception");
              }
              if (msg.method === "Runtime.consoleAPICalled" && msg.params.type === "error") {
                errors.push(msg.params.args.map((arg) => arg.value || arg.description || "").join(" "));
              }
              if (msg.method === "Log.entryAdded" && msg.params.entry.level === "error") {
                errors.push(msg.params.entry.text);
              }
            };
            await new Promise((resolve, reject) => {
              ws.onopen = resolve;
              ws.onerror = () => reject(new Error("Chrome DevTools websocket failed"));
            });
            function send(method, params = {}) {
              const id = ++seq;
              ws.send(JSON.stringify({ id, method, params }));
              return new Promise((resolve) => pending.set(id, resolve));
            }
            await send("Runtime.enable");
            await send("Log.enable");
            await send("Page.enable");
            await send("Page.navigate", { url: "http://127.0.0.1:4173/" });
            for (let i = 0; i < 80 && !loaded; i++) await delay(100);
            await delay(2500);
            const evaluated = await send("Runtime.evaluate", {
              expression: "(() => ({ bodyText: document.body?.innerText?.trim().slice(0, 200) || '', canvasCount: document.querySelectorAll('canvas').length, bodyChildren: document.body?.childElementCount || 0, rootChildren: document.getElementById('root')?.childElementCount || 0 }))()",
              returnByValue: true,
            });
            const value = evaluated.result?.result?.value;
            const realErrors = errors.filter(e => !isIgnoredBrowserNoise(e));
            if (realErrors.length) throw new Error("Browser errors:\\n" + realErrors.slice(0, 8).join("\\n"));
            if (!value || (value.bodyChildren === 0 && value.rootChildren === 0 && value.canvasCount === 0)) {
              throw new Error("Game rendered no body/root/canvas content");
            }
            console.log("Smoke OK:", JSON.stringify(value));
            ws.close();
          } finally {
            chrome.kill("SIGTERM");
          }
          }
          main().catch((err) => { console.error(err.stack || err); process.exit(1); });
          NODE
            kill "$PREVIEW_PID" 2>/dev/null || true
            wait "$PREVIEW_PID" 2>/dev/null || true
            return "$rc"
          }
          smoke_run || { echo "::warning::smoke attempt 1 failed; retrying once after 5s"; sleep 5; smoke_run; }

      # Hand the built artifact off to the deploy job. `if-no-files-found:
      # error` means we'd rather hard-fail than silently deploy nothing.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: compliance
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_API: https://admin.freegamestore.online
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: site
      - name: Upload keylessly
        run: |
          set -euo pipefail
          cd site
          test -n "$(ls -A .)" || { echo "::error::build artifact is empty"; exit 1; }
          find . -type f -printf '%P\t%s\n' \
            | jq -Rn '{files: [inputs | split("\t") | {key: .[0], value: (.[1] | tonumber)}] | from_entries}' \
            > "$RUNNER_TEMP/manifest.json"
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DEPLOY_API" | jq -r .value)
          echo "::add-mask::$oidc"
          session=$(curl -sS --fail-with-body -X POST "$DEPLOY_API/v1/deploys" \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/manifest.json") \
            || { echo "::error::deploy refused: $session"; exit 1; }
          DEPLOY_TOKEN=$(jq -r .token <<<"$session")
          echo "::add-mask::$DEPLOY_TOKEN"
          DEPLOY_URL="$DEPLOY_API/v1/deploys/$(jq -r .id <<<"$session")"
          export DEPLOY_TOKEN DEPLOY_URL
          upload() {
            curl -sS --fail-with-body --retry 3 --retry-all-errors -T "./$1" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/octet-stream' \
              "$DEPLOY_URL/files/$(jq -rn --arg p "$1" '$p | split("/") | map(@uri) | join("/")')"
          }
          export -f upload
          find . -type f -printf '%P\0' | xargs -0 -P 8 -n 1 bash -c 'upload "$1"' _
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL/commit"
          echo
          echo "Deployed ${GITHUB_REPOSITORY##*/} from ${GITHUB_SHA::7}"
