name: Game CI / Deploy (reusable)

# Reusable workflow that every sibling game in freegamestore-online/* calls
# from its own .github/workflows/deploy.yml.
#
# Why this exists:
#   - 43 games shouldn't each carry ~70 lines of identical yaml that drifts
#     out of sync.
#   - Pinning the compliance CLI / wrangler / node versions in ONE place
#     means a single PR here lifts the whole platform forward.
#   - The build/compliance/deploy pipeline is provably the same for every
#     game — no per-repo accidental divergence.
#
# Each game's caller file is ~15 lines:
#   on: { push: { branches: [main] }, pull_request: { branches: [main] } }
#   jobs:
#     ci-and-deploy:
#       uses: freegamestore-online/freegamestore/.github/workflows/game-ci.yml@main
#       with:
#         cf_project: freebowlingapp
#       permissions: { contents: read, deployments: write }
#       secrets: inherit
#
# Two-job design (compliance → deploy):
#   The compliance job runs untrusted code — `npx @freegamestore/cli`
#   ultimately resolves to whatever npm serves and runs in the runner. By
#   placing the deploy in a separate job with `needs: compliance`, the
#   Cloudflare deploy token NEVER co-exists in the same runner process
#   with the compliance CLI. A compromised CLI release can fail the
#   build, but cannot exfiltrate the CF token (it's only present in the
#   second job's environment) and cannot tamper with the artifact in a
#   way that survives the artifact upload/download round-trip without
#   detection. The compliance job has no secrets at all; the deploy job
#   has only what it strictly needs.

on:
  workflow_call:
    inputs:
      cf_project:
        description: "DEPRECATED — legacy CF Pages project name. Ignored since the Path B migration (2026-05-28); games deploy to R2, not CF Pages. Kept so existing caller files don't error."
        required: false
        type: string
      compliance_cli_version:
        description: "Pinned @freegamestore/cli version for the compliance gate. Bump deliberately."
        required: false
        type: string
        default: "0.2.3"
      node_version:
        description: "Node.js major version"
        required: false
        type: string
        default: "22"
      cloudflare_account_id:
        description: "Cloudflare account ID (same across the platform)"
        required: false
        type: string
        default: "c1089bfcc43c1c6c2aa89e584e86f0bc"
    secrets:
      # Path B (R2) deploy creds — org-level secrets on freegamestore-online.
      # CLOUDFLARE_API_TOKEN is no longer required (we don't `wrangler pages
      # deploy` anymore) but stays optional so callers passing it don't break.
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  # Build + compliance check. NO secrets in this job's env — if the
  # pinned CLI version is compromised, the worst it can do is fail
  # this job (blocking deploy) or upload a tampered artifact. Either
  # is recoverable.
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Platform compliance — runs every check the CLI ships (bundle size,
      # brand fonts, tracking SDKs, PWA manifest, store link, audio mute,
      # viewport, brand-token leaks). Pinned version so a CLI release can't
      # silently flip green deploys to red.
      - name: Platform compliance
        run: npx -y "@freegamestore/cli@${{ inputs.compliance_cli_version }}" check

      - name: Stamp version.json
        run: |
          cat > web/dist/version.json <<JSON
          {
            "repo": "${GITHUB_REPOSITORY##*/}",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${GITHUB_SHA::7}",
            "version": "${GITHUB_SHA::7}",
            "source": "build-stamp",
            "ref": "${GITHUB_REF_NAME}",
            "runNumber": ${GITHUB_RUN_NUMBER},
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "version.json:"; cat web/dist/version.json

      - name: Smoke test built game
        run: |
          pnpm --dir web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/fgs-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node <<'NODE'
          const { spawn } = require("node:child_process");
          async function main() {
          const chromeBin = process.env.CHROME_BIN || "/usr/bin/google-chrome";
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const chrome = spawn(chromeBin, [
            "--headless=new",
            "--disable-gpu",
            "--no-sandbox",
            "--remote-debugging-address=127.0.0.1",
            "--remote-debugging-port=9222",
            "--disable-dev-shm-usage",
            "--no-first-run",
            "--no-default-browser-check",
            "--disable-background-networking",
            "--user-data-dir=/tmp/fgs-smoke-chrome",
            "about:blank",
          ], { stdio: ["ignore", "ignore", "pipe"] });
          let stderr = "";
          chrome.stderr.on("data", (chunk) => { stderr += chunk.toString(); });
          async function fetchJson(url, init) {
            const res = await fetch(url, init);
            if (!res.ok) throw new Error(url + " returned HTTP " + res.status);
            return res.json();
          }
          try {
            for (let i = 0; i < 80; i++) {
              try { await fetchJson("http://127.0.0.1:9222/json/version"); break; }
              catch { if (i === 79) throw new Error("Chrome DevTools did not start: " + stderr.slice(-1000)); await delay(250); }
            }
            let target;
            try {
              target = await fetchJson("http://127.0.0.1:9222/json/new?http://127.0.0.1:4173/", { method: "PUT" });
            } catch {
              target = (await fetchJson("http://127.0.0.1:9222/json/list"))[0];
            }
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            let seq = 0;
            const pending = new Map();
            const errors = [];
            function isIgnoredBrowserNoise(text) {
              return /Failed to load resource: the server responded with a status of 404/.test(text) ||
                /auth\.freegamestore\.online\/v1\/me/.test(text) ||
                /No 'Access-Control-Allow-Origin' header/.test(text) ||
                /Failed to load resource: net::ERR_FAILED/.test(text);
            }
            let loaded = false;
            ws.onmessage = (event) => {
              const msg = JSON.parse(event.data);
              if (msg.id && pending.has(msg.id)) {
                pending.get(msg.id)(msg);
                pending.delete(msg.id);
                return;
              }
              if (msg.method === "Page.loadEventFired") loaded = true;
              if (msg.method === "Runtime.exceptionThrown") {
                const ex = msg.params.exceptionDetails;
                errors.push(ex.exception?.description || ex.text || "Runtime exception");
              }
              if (msg.method === "Runtime.consoleAPICalled" && msg.params.type === "error") {
                errors.push(msg.params.args.map((arg) => arg.value || arg.description || "").join(" "));
              }
              if (msg.method === "Log.entryAdded" && msg.params.entry.level === "error") {
                errors.push(msg.params.entry.text);
              }
            };
            await new Promise((resolve, reject) => {
              ws.onopen = resolve;
              ws.onerror = () => reject(new Error("Chrome DevTools websocket failed"));
            });
            function send(method, params = {}) {
              const id = ++seq;
              ws.send(JSON.stringify({ id, method, params }));
              return new Promise((resolve) => pending.set(id, resolve));
            }
            await send("Runtime.enable");
            await send("Log.enable");
            await send("Page.enable");
            await send("Page.navigate", { url: "http://127.0.0.1:4173/" });
            for (let i = 0; i < 80 && !loaded; i++) await delay(100);
            await delay(2500);
            const evaluated = await send("Runtime.evaluate", {
              expression: "(() => ({ bodyText: document.body?.innerText?.trim().slice(0, 200) || '', canvasCount: document.querySelectorAll('canvas').length, bodyChildren: document.body?.childElementCount || 0, rootChildren: document.getElementById('root')?.childElementCount || 0 }))()",
              returnByValue: true,
            });
            const value = evaluated.result?.result?.value;
            if (errors.length) throw new Error("Browser errors:\\n" + errors.slice(0, 8).join("\\n"));
            if (!value || (value.bodyChildren === 0 && value.rootChildren === 0 && value.canvasCount === 0)) {
              throw new Error("Game rendered no body/root/canvas content");
            }
            console.log("Smoke OK:", JSON.stringify(value));
            ws.close();
          } finally {
            chrome.kill("SIGTERM");
          }
          }
          main().catch((err) => { console.error(err.stack || err); process.exit(1); });
          NODE

      # Hand the built artifact off to the deploy job. `if-no-files-found:
      # error` means we'd rather hard-fail than silently deploy nothing.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  # Deploy job (Path B) — runs only on push-to-main. Downloads the artifact
  # built by the compliance job and syncs it to the fgs-games R2 bucket at
  # games/<repo>/. The freegamestore-host Worker (*.freegamestore.online/*)
  # serves from that prefix using a D1 routes row written at provision time
  # by freegamestore-admin. No per-game CF Pages project → no 100/account
  # cap on the free games side. The R2 creds live in this second job only,
  # never alongside the untrusted compliance CLI (same isolation rationale
  # as before, just R2 creds instead of a Pages token).
  deploy:
    needs: compliance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to R2 (Path B)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::R2_ACCESS_KEY_ID not set on freegamestore-online org secrets"; exit 1; }
          aws s3 sync web/dist "s3://fgs-games/games/${GITHUB_REPOSITORY##*/}/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete \
            --no-progress
          echo "Deployed games/${GITHUB_REPOSITORY##*/} from ${GITHUB_SHA::7} to R2 (Path B)"
